<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7B1C1C">
<meta name="description" content="PHD125 Pharmaceutical Organic Chemistry – Interactive Tutorial Answer Scheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="#" id="manifest-placeholder">
<title>PHD125 · Answer Scheme</title>
<style>
:root{
  --maroon:#7B1C1C;--maroon-dark:#5A1414;--maroon-light:#A52828;
  --gold:#C8960C;--gold-light:#F0B429;
  --bg:#F4F4F6;--surface:#FFFFFF;--surface2:#F8F8FA;
  --border:#E2E2E8;--border-light:#EEEEEE;
  --text:#1A1A2E;--text2:#555566;--text3:#888899;
  --green:#2E7D32;--green-bg:#F0F7F0;
  --blue:#1565C0;--blue-bg:#EEF2FF;
  --amber:#E65100;--amber-bg:#FFF8E1;
  --sidebar-w:285px;--topbar-h:60px;
  --radius:8px;--shadow:0 2px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);--transition:0.2s ease;
}
[data-theme="dark"]{
  --bg:#0F0F17;--surface:#1A1A28;--surface2:#22223A;
  --border:#2A2A40;--border-light:#333348;
  --text:#E8E8F0;--text2:#A0A0C0;--text3:#666688;
  --green-bg:#0A2010;--blue-bg:#0A1030;--amber-bg:#201500;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;color:var(--text);
  background:var(--bg);line-height:1.6;transition:background var(--transition),color var(--transition);}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden;}

/* Sidebar */
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--maroon-dark);color:white;
  display:flex;flex-direction:column;overflow:hidden;transition:transform var(--transition);
  position:relative;z-index:100;}
#sidebar-header{padding:18px 16px 14px;background:linear-gradient(135deg,var(--maroon-dark),#3A0A0A);
  border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;}
#sidebar-header .course-code{font-size:11px;font-weight:700;letter-spacing:.15em;
  color:var(--gold-light);text-transform:uppercase;margin-bottom:2px;}
#sidebar-header h1{font-size:14px;font-weight:700;color:white;line-height:1.3;}
#sidebar-header .sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;}
#tutorial-selector{padding:10px 12px;background:rgba(0,0,0,.2);
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
#tutorial-selector label{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:5px;}
#tutorial-select{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:white;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;appearance:none;}
#progress-wrap{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
#progress-label{display:flex;justify-content:space-between;font-size:11px;
  color:rgba(255,255,255,.55);margin-bottom:5px;}
#progress-bar-bg{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
#progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border-radius:3px;transition:width .4s ease;width:0%;}
#nav-tree{flex:1;overflow-y:auto;padding:8px 0;}
#nav-tree::-webkit-scrollbar{width:4px;}
#nav-tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.nav-section{margin:2px 0;}
.nav-section-btn{width:100%;background:none;border:none;color:rgba(255,255,255,.8);
  text-align:left;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:background var(--transition);}
.nav-section-btn:hover{background:rgba(255,255,255,.08);}
.nav-section-btn.active{color:var(--gold-light);background:rgba(200,150,12,.15);}
.nav-section-btn .chev{margin-left:auto;font-size:10px;transition:transform var(--transition);}
.nav-section-btn.open .chev{transform:rotate(90deg);}
.nav-items{display:none;}
.nav-items.open{display:block;}
.nav-item{width:100%;background:none;border:none;color:rgba(255,255,255,.55);
  text-align:left;padding:6px 16px 6px 36px;font-size:11.5px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:all var(--transition);}
.nav-item:hover{color:white;background:rgba(255,255,255,.05);}
.nav-item.active{color:var(--gold-light);}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);
  margin-left:auto;opacity:0;flex-shrink:0;}
.nav-item.done .dot{opacity:1;}
#sidebar-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);
  flex-shrink:0;display:flex;gap:6px;}
.sb-btn{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.7);border-radius:6px;padding:6px 4px;font-size:11px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;
  transition:all var(--transition);}
.sb-btn:hover{background:rgba(255,255,255,.15);color:white;}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0;box-shadow:var(--shadow);}
#menu-toggle{background:none;border:none;cursor:pointer;padding:6px;color:var(--text2);
  font-size:18px;display:none;}
#search-wrap{flex:1;max-width:480px;position:relative;}
#search-input{width:100%;padding:8px 36px;border:1.5px solid var(--border);border-radius:20px;
  font-size:13px;background:var(--bg);color:var(--text);outline:none;
  transition:border-color var(--transition);}
#search-input:focus{border-color:var(--maroon);}
#search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);}
#search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--text3);display:none;font-size:16px;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.act-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;
  font-size:12px;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:4px;
  transition:all var(--transition);}
.act-btn:hover{border-color:var(--maroon);color:var(--maroon);}

/* Filter bar */
#filter-bar{padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;overflow-x:auto;flex-shrink:0;}
#filter-bar::-webkit-scrollbar{height:0;}
.chip{padding:4px 12px;border-radius:14px;font-size:12px;font-weight:600;
  border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);
  cursor:pointer;white-space:nowrap;transition:all var(--transition);flex-shrink:0;}
.chip:hover{border-color:var(--maroon);color:var(--maroon);}
.chip.active{background:var(--maroon);color:white;border-color:var(--maroon);}
.chip-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}

/* Content */
#content{flex:1;overflow-y:auto;padding:20px;}
#content::-webkit-scrollbar{width:6px;}
#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* Section heading */
.sec-head{display:flex;align-items:center;gap:10px;margin:0 0 16px;
  padding-bottom:10px;border-bottom:2px solid var(--maroon);}
.sec-icon{width:34px;height:34px;border-radius:8px;background:var(--maroon);
  display:flex;align-items:center;justify-content:center;color:white;
  font-size:16px;flex-shrink:0;}
.sec-head h2{font-size:16px;font-weight:700;color:var(--maroon);}
.sec-head .qc{margin-left:auto;font-size:11px;color:var(--text3);
  background:var(--surface2);padding:3px 8px;border-radius:10px;}

/* Question cards */
.qcard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;transition:box-shadow var(--transition),border-color var(--transition);}
.qcard:hover{box-shadow:var(--shadow);}
.qcard.done{border-color:var(--green);}
.qcard.done .qhead{background:var(--green-bg);}
.qhead{padding:12px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;
  background:var(--surface);transition:background var(--transition);user-select:none;}
.qhead:hover{background:var(--surface2);}
.qnum{min-width:28px;height:28px;border-radius:6px;background:var(--maroon);color:white;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;}
.qcard.done .qnum{background:var(--green);}
.qtitle{flex:1;}
.qlabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text3);margin-bottom:2px;}
.qtext{font-size:13px;color:var(--text);line-height:1.5;}
.qmeta{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap;}
.qtag{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;}
.tag-aldehyde{background:#BBDEFB;color:#0D47A1;}
.tag-ketone{background:#E1BEE7;color:#4A148C;}
.tag-acid{background:#C8E6C9;color:#1B5E20;}
.tag-ester{background:#FFE0B2;color:#E65100;}
.tag-amide{background:#F3E5F5;color:#6A1B9A;}
.tag-amine{background:#E0F2F1;color:#004D40;}
.tag-reaction{background:#FFF9C4;color:#827717;}
.tag-mechanism{background:#E8EAF6;color:#283593;}
.tag-naming{background:#FCE4EC;color:#880E4F;}
.tag-identification{background:#E8F5E9;color:#1B5E20;}
.tag-synthesis{background:#FFF3E0;color:#E65100;}
.tag-drawing{background:#F3E5F5;color:#4A148C;}
.tag-exam{background:#FFCDD2;color:#B71C1C;}
.examyr{font-size:10px;background:var(--amber-bg);color:var(--amber);
  border:1px solid var(--amber);border-radius:8px;padding:1px 7px;font-weight:700;}
.qactions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.toggle-btn{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text3);
  transition:transform var(--transition);padding:2px;}
.qcard.open .toggle-btn{transform:rotate(180deg);}
.done-btn{background:none;border:1.5px solid var(--border);border-radius:6px;width:26px;
  height:26px;cursor:pointer;font-size:14px;display:flex;align-items:center;
  justify-content:center;transition:all var(--transition);}
.done-btn:hover{border-color:var(--green);color:var(--green);}
.qcard.done .done-btn{background:var(--green);border-color:var(--green);color:white;}

/* Answer panel */
.qanswer{display:none;padding:0 16px 14px;border-top:1px solid var(--border-light);}
.qcard.open .qanswer{display:block;}
.answer-inner{padding-top:12px;}

/* Answer components */
.ans-box{background:var(--green-bg);border-left:3px solid var(--green);
  padding:8px 12px;border-radius:4px;font-size:13px;margin:6px 0;}
.note-box{background:var(--amber-bg);border-left:3px solid var(--gold);
  padding:8px 12px;border-radius:4px;font-size:12.5px;margin:6px 0;}
.eq-box{background:var(--blue-bg);border-left:3px solid var(--blue);
  padding:8px 12px;border-radius:4px;font-family:'Courier New',monospace;
  font-size:12px;margin:6px 0;line-height:2;overflow-x:auto;white-space:pre-wrap;}
.pharma-box{background:linear-gradient(135deg,#FFF3E0,#FFF8E1);
  border:1px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:12px;margin:8px 0;}
.ans-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0;}
.ans-table th{background:var(--maroon);color:white;padding:5px 8px;text-align:left;font-weight:600;}
.ans-table td{padding:5px 8px;border-bottom:1px solid var(--border-light);vertical-align:top;}
.ans-table tr:nth-child(even) td{background:var(--surface2);}
.diag-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;align-items:flex-start;}
.diag-card{background:var(--surface2);border:1.5px solid var(--border);border-radius:6px;
  padding:8px 10px 6px;text-align:center;flex-shrink:0;}
.diag-card .dn{font-size:8.5pt;font-weight:700;color:var(--maroon);margin-top:5px;line-height:1.3;}
.diag-card .df{font-size:7.5pt;color:var(--text3);margin-top:2px;font-family:monospace;}
.diag-card .db{display:inline-block;font-size:8pt;padding:2px 6px;border-radius:8px;
  margin-top:3px;font-weight:700;}
.mech-wrap{margin:8px 0;}
.mech-step{display:flex;gap:10px;align-items:flex-start;padding:7px;
  background:var(--surface2);border-radius:5px;margin-bottom:5px;font-size:12.5px;}
.mstep{min-width:22px;height:22px;border-radius:50%;background:var(--maroon);
  color:white;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0;}
.info-card{background:var(--surface2);border:1px solid var(--border);
  border-radius:5px;padding:8px 10px;font-size:12px;}
.ic-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:3px;}
.ic-val{font-weight:700;color:var(--text);}
.chem{font-family:'Courier New',monospace;font-size:12px;background:var(--surface2);
  padding:1px 4px;border-radius:3px;}

/* No results */
#no-results{display:none;text-align:center;padding:60px 20px;color:var(--text3);}

/* Welcome */
#welcome{padding:0;max-width:680px;}
.w-hero{background:linear-gradient(135deg,var(--maroon-dark),var(--maroon));color:white;
  border-radius:12px;padding:28px;margin-bottom:20px;box-shadow:var(--shadow-lg);}
.w-hero h2{font-size:22px;margin-bottom:6px;}
.w-hero .ws{opacity:.75;font-size:14px;}
.w-badges{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.w-badge{background:rgba(255,255,255,.15);border-radius:12px;padding:3px 10px;font-size:11px;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 20px;}
.stat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;
  padding:14px;text-align:center;}
.stat-card .sn{font-size:28px;font-weight:700;color:var(--maroon);}
.stat-card .sl{font-size:12px;color:var(--text3);margin-top:2px;}
.tut-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px;}
.tut-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;
  padding:14px;cursor:pointer;transition:all var(--transition);}
.tut-card:hover{border-color:var(--maroon);box-shadow:var(--shadow);transform:translateY(-2px);}
.tut-card .tc{font-size:10px;font-weight:700;color:var(--maroon);letter-spacing:.1em;}
.tut-card .tt{font-size:13px;font-weight:600;color:var(--text);margin-top:2px;}
.tut-card .tm{font-size:11px;color:var(--text3);}
.tut-card .tp{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;}
.tut-card .tpf{height:100%;background:var(--maroon);border-radius:2px;}
.how-box{padding:14px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;}

/* Mobile */
@media(max-width:768px){
  #sidebar{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%);z-index:200;}
  #sidebar.open{transform:translateX(0);}
  #menu-toggle{display:flex;}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}
  #overlay.show{display:block;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .grid2,.grid3{grid-template-columns:1fr;}
  #topbar{padding:0 12px;}
  #content{padding:12px;}
  .diag-row{justify-content:center;}
}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr;}}
@media print{
  #sidebar,#topbar,#filter-bar,.qactions,#menu-toggle{display:none!important;}
  #main{overflow:visible;}#content{overflow:visible;padding:0;}
  .qanswer{display:block!important;}
  .qcard{page-break-inside:avoid;margin-bottom:8px;border:1px solid #ccc;}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.qcard{animation:fadeIn .18s ease both;}
</style>
</head>
<body>
<div id="overlay" onclick="closeSidebar()"></div>
<div id="app">

<!-- ═══════════ SIDEBAR ═══════════ -->
<nav id="sidebar">
  <div id="sidebar-header">
    <div class="course-code">PHD125</div>
    <h1>Pharmaceutical<br>Organic Chemistry</h1>
    <div class="sub">Interactive Answer Scheme · Malaysia</div>
  </div>
  <div id="tutorial-selector">
    <label>Select Tutorial</label>
    <select id="tutorial-select" onchange="loadTutorial(this.value)"></select>
  </div>
  <div id="progress-wrap">
    <div id="progress-label">
      <span>Progress</span><span id="prog-text">0 / 0</span>
    </div>
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  </div>
  <div id="nav-tree"></div>
  <div id="sidebar-footer">
    <button class="sb-btn" onclick="showWelcome()">🏠</button>
    <button class="sb-btn" onclick="expandAll()">↕ All</button>
    <button class="sb-btn" onclick="resetProg()">↺</button>
    <button class="sb-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
    <button class="sb-btn" onclick="window.print()">🖨</button>
  </div>
</nav>

<!-- ═══════════ MAIN ═══════════ -->
<div id="main">
  <div id="topbar">
    <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search questions, compounds, reactions…"
        oninput="doSearch(this.value)">
      <button id="search-clear" onclick="clearSearch()">✕</button>
    </div>
    <div class="topbar-right">
      <button class="act-btn" onclick="window.print()">🖨 Print</button>
    </div>
  </div>
  <div id="filter-bar">
    <span style="font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;">Filter:</span>
    <button class="chip active" onclick="setFilter('all',this)">All</button>
    <div class="chip-sep"></div>
    <button class="chip" onclick="setFilter('tag:aldehyde',this)">Aldehydes</button>
    <button class="chip" onclick="setFilter('tag:ketone',this)">Ketones</button>
    <button class="chip" onclick="setFilter('tag:acid',this)">Carboxylic Acids</button>
    <button class="chip" onclick="setFilter('tag:ester',this)">Esters</button>
    <button class="chip" onclick="setFilter('tag:amide',this)">Amides</button>
    <button class="chip" onclick="setFilter('tag:amine',this)">Amines</button>
    <div class="chip-sep"></div>
    <button class="chip" onclick="setFilter('tag:reaction',this)">Reactions</button>
    <button class="chip" onclick="setFilter('tag:mechanism',this)">Mechanisms</button>
    <button class="chip" onclick="setFilter('tag:synthesis',this)">Synthesis</button>
    <button class="chip" onclick="setFilter('tag:exam',this)">📝 Past Exam</button>
    <button class="chip" onclick="setFilter('undone',this)">⬜ Incomplete</button>
    <button class="chip" onclick="setFilter('done',this)">✅ Done</button>
  </div>
  <div id="content">
    <div id="welcome"></div>
    <div id="qcontainer"></div>
    <div id="no-results">
      <div style="font-size:48px;">🔍</div>
      <div style="font-size:15px;font-weight:600;color:var(--text2);margin-top:8px;">No results found</div>
      <div style="font-size:13px;margin-top:4px;">Try different keywords or clear the filter</div>
    </div>
  </div>
</div>
</div>

<script>
/* ════════════════════════════════════════════════════
   ANSWER HELPERS — used inside tutorial data below
════════════════════════════════════════════════════ */
const R = {
  ans:   t => `<div class="ans-box">${t}</div>`,
  note:  t => `<div class="note-box"><strong>📌 Note:</strong> ${t}</div>`,
  pharma:t => `<div class="pharma-box">⚕️ <strong style="color:var(--amber)">Pharmaceutical note (Malaysia):</strong> ${t}</div>`,
  eq:    t => `<div class="eq-box">${t}</div>`,
  mech: steps => `<div class="mech-wrap">${steps.map((s,i)=>`<div class="mech-step"><div class="mstep">${i+1}</div><div>${s}</div></div>`).join('')}</div>`,
  table:(heads,rows) => `<table class="ans-table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`,
  grid2: items => `<div class="grid2">${items.map(i=>`<div class="info-card">${i}</div>`).join('')}</div>`,
  grid3: items => `<div class="grid3">${items.map(i=>`<div class="info-card">${i}</div>`).join('')}</div>`,
  lbl:  (l,v) => `<div class="ic-label">${l}</div><div class="ic-val">${v}</div>`,
  diag: items => `<div class="diag-row">${items.map(d=>`
    <div class="diag-card">

/* ════════════════════════════════════════════════════
   APP STATE
════════════════════════════════════════════════════ */
const state = {
  currentTutorial: null,
  filter: 'all',
  searchQuery: '',
  done: {},
  expanded: {},
  theme: 'light',
};

/* ════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  loadState();
  applyTheme();
  populateSelector();
  // Auto-load first tutorial
  const firstId = Object.keys(TUTORIALS)[0];
  if (firstId) {
    document.getElementById('tutorial-select').value = firstId;
    loadTutorial(firstId);
  }
  // Register PWA service worker if available
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('data:text/javascript,').catch(()=>{});
  }
});

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('phd125_v2') || '{}');
    state.done = s.done || {};
    state.theme = s.theme || 'light';
    state.expanded = s.expanded || {};
  } catch(e) {}
}
function saveState() {
  try {
    localStorage.setItem('phd125_v2', JSON.stringify({
      done: state.done, theme: state.theme, expanded: state.expanded,
    }));
  } catch(e) {}
}

/* ════════════════════════════════════════════════════
   TUTORIAL SELECTOR
════════════════════════════════════════════════════ */
function populateSelector() {
  const sel = document.getElementById('tutorial-select');
  sel.innerHTML = '';
  Object.values(TUTORIALS).forEach(t => {
    const o = document.createElement('option');
    o.value = t.id;
    o.textContent = `Tutorial ${t.tutorialNo}: ${t.topicShort.substring(0,35)}...`;
    sel.appendChild(o);
  });
}

function loadTutorial(id) {
  if (!id || !TUTORIALS[id]) return;
  state.currentTutorial = id;
  const t = TUTORIALS[id];
  renderNav(t);
  renderContent(t);
  updateProgress();
}

/* ════════════════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════════════════ */
function renderNav(tutorial) {
  const tree = document.getElementById('nav-tree');
  tree.innerHTML = '';
  tutorial.sections.forEach((sec, si) => {
    const done = sec.questions.filter(q => state.done[q.id]).length;
    const wrap = document.createElement('div');
    wrap.className = 'nav-section';
    wrap.innerHTML = `
      <button class="nav-section-btn" onclick="toggleNav(this,'nav-${sec.id}')">
        <span>${sec.icon||'📚'}</span>
        <span style="flex:1;text-align:left;">${sec.shortTitle||sec.title}</span>
        <span style="font-size:10px;opacity:.5;">${done}/${sec.questions.length}</span>
        <span class="chev">▶</span>
      </button>
      <div class="nav-items" id="nav-${sec.id}">
        ${sec.questions.map(q=>`
          <button class="nav-item${state.done[q.id]?' done':''}" id="nv-${q.id}"
            onclick="scrollTo('qc-${q.id}')">
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${q.navLabel||q.id}</span>
            <span class="dot"></span>
          </button>`).join('')}
      </div>`;
    tree.appendChild(wrap);
    if (si === 0) {
      const btn = wrap.querySelector('.nav-section-btn');
      toggleNav(btn, 'nav-' + sec.id);
    }
  });
}

function toggleNav(btn, id) {
  document.querySelectorAll('.nav-items').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.nav-section-btn').forEach(el => el.classList.remove('open'));
  const el = document.getElementById(id);
  if (el && !el.classList.contains('open')) {
    el.classList.add('open');
    btn.classList.add('open');
  }
}

function scrollTo(id) {
  closeSidebar();
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ════════════════════════════════════════════════════
   RENDER QUESTIONS
════════════════════════════════════════════════════ */
function renderContent(tutorial) {
  document.getElementById('welcome').innerHTML = '';
  const container = document.getElementById('qcontainer');
  container.innerHTML = '';
  document.getElementById('no-results').style.display = 'none';
  tutorial.sections.forEach(sec => {
    const wrap = document.createElement('div');
    wrap.id = 'sec-' + sec.id;
    wrap.innerHTML = `<div class="sec-head">
      <div class="sec-icon">${sec.icon||'📚'}</div>
      <h2>${sec.title}</h2>
      <span class="qc">${sec.questions.length} questions</span>
    </div>`;
    sec.questions.forEach(q => wrap.appendChild(buildCard(q)));
    container.appendChild(wrap);
  });
}

function buildCard(q) {
  const div = document.createElement('div');
  div.className = `qcard${state.done[q.id]?' done':''}${state.expanded[q.id]?' open':''}`;
  div.id = 'qc-' + q.id;
  div.dataset.tags = (q.tags||[]).join(' ');
  div.dataset.text = (q.question + ' ' + (q.searchText||'')).toLowerCase();
  const tags = (q.tags||[]).map(t=>`<span class="qtag tag-${t}">${t}</span>`).join('');
  const exam = q.examYear ? `<span class="examyr">Exam ${q.examYear}</span>` : '';
  div.innerHTML = `
    <div class="qhead" onclick="toggleCard('${q.id}')">
      <div class="qnum">${q.num||'?'}</div>
      <div class="qtitle">
        <div class="qlabel">${q.type||'Question'}</div>
        <div class="qtext">${q.questionHTML||q.question}</div>
        <div class="qmeta">${tags}${exam}</div>
      </div>
      <div class="qactions">
        <button class="done-btn" onclick="event.stopPropagation();markDone('${q.id}')" title="Mark done">✓</button>
        <button class="toggle-btn" onclick="event.stopPropagation();toggleCard('${q.id}')">▾</button>
      </div>
    </div>
    <div class="qanswer"><div class="answer-inner">${q.answerHTML||`<div class="ans-box">${q.answer||'Answer coming soon.'}</div>`}</div></div>`;
  return div;
}

/* ════════════════════════════════════════════════════
   INTERACTIONS
════════════════════════════════════════════════════ */
function toggleCard(qId) {
  const c = document.getElementById('qc-'+qId);
  const open = !c.classList.contains('open');
  c.classList.toggle('open', open);
  state.expanded[qId] = open;
  saveState();
}

function markDone(qId) {
  state.done[qId] = !state.done[qId];
  document.getElementById('qc-'+qId).classList.toggle('done', !!state.done[qId]);
  const nv = document.getElementById('nv-'+qId);
  if (nv) nv.classList.toggle('done', !!state.done[qId]);
  saveState();
  updateProgress();
}

function expandAll() {
  const allOpen = [...document.querySelectorAll('.qcard')].every(c => c.classList.contains('open'));
  document.querySelectorAll('.qcard').forEach(c => {
    const id = c.id.replace('qc-','');
    c.classList.toggle('open', !allOpen);
    state.expanded[id] = !allOpen;
  });
  saveState();
}

function resetProg() {
  if (!confirm('Reset all progress?')) return;
  const t = TUTORIALS[state.currentTutorial];
  if (t) t.sections.forEach(s => s.questions.forEach(q => { delete state.done[q.id]; delete state.expanded[q.id]; }));
  document.querySelectorAll('.qcard.done,.qcard.open').forEach(c => c.classList.remove('done','open'));
  document.querySelectorAll('.nav-item.done').forEach(c => c.classList.remove('done'));
  saveState(); updateProgress();
}

function updateProgress() {
  const t = TUTORIALS[state.currentTutorial];
  if (!t) return;
  const all = t.sections.flatMap(s=>s.questions);
  const done = all.filter(q=>state.done[q.id]).length;
  document.getElementById('prog-text').textContent = `${done} / ${all.length}`;
  document.getElementById('progress-bar-fill').style.width = all.length ? `${Math.round(done/all.length*100)}%` : '0%';
}

/* ════════════════════════════════════════════════════
   SEARCH & FILTER
════════════════════════════════════════════════════ */
function doSearch(val) {
  state.searchQuery = val.trim().toLowerCase();
  document.getElementById('search-clear').style.display = val ? 'flex' : 'none';
  applyFilters();
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  doSearch('');
}
function setFilter(f, btn) {
  state.filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyFilters();
}
function applyFilters() {
  let vis = 0;
  document.querySelectorAll('.qcard').forEach(card => {
    const id = card.id.replace('qc-','');
    const tags = card.dataset.tags||'';
    const text = card.dataset.text||'';
    let show = true;
    if (state.searchQuery) show = text.includes(state.searchQuery)||tags.includes(state.searchQuery);
    if (show && state.filter !== 'all') {
      if (state.filter==='done') show = !!state.done[id];
      else if (state.filter==='undone') show = !state.done[id];
      else if (state.filter.startsWith('tag:')) show = tags.includes(state.filter.replace('tag:',''));
    }
    card.style.display = show ? '' : 'none';
    if (show) vis++;
  });
  document.querySelectorAll('[id^="sec-"]').forEach(sec => {
    const v = [...sec.querySelectorAll('.qcard')].some(c=>c.style.display!=='none');
    sec.style.display = v ? '' : 'none';
  });
  document.getElementById('no-results').style.display = vis===0 ? 'block' : 'none';
}

/* ════════════════════════════════════════════════════
   THEME & SIDEBAR
════════════════════════════════════════════════════ */
function toggleTheme() {
  state.theme = state.theme==='light' ? 'dark' : 'light';
  applyTheme(); saveState();
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('theme-btn').textContent = state.theme==='light' ? '🌙' : '☀️';
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show',
    document.getElementById('sidebar').classList.contains('open'));
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function showWelcome() { closeSidebar(); }
</script>
